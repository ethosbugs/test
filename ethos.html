<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a12">
<title>ETHOS PLAYER • NEON v3.2</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="wrap">
  <header class="top">
    <a class="logo" href="index.html">ETHOS PLAYER</a>
    <div class="controls">
      <input class="input" type="search" id="searchBar" placeholder="Buscar juego (pulsa /)" aria-label="Buscar juego" style="width:260px">
      <button class="btn" id="btnAI">ETHOS AI</button>
      <button class="btn" id="btnSpotify">SPOTIFY</button>
      <button class="btn" onclick="location.href='admin.html'">ADMIN</button>
    </div>
  </header>

  <nav class="cat-bar" id="catBar" aria-label="Categorías"></nav>
  <main class="games" id="lista" aria-live="polite"></main>
  <div class="counter" id="counter">0 JUEGOS</div>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Juego">
  <div class="player-bar">
    <strong id="playerTitle"></strong>
    <button class="btn small" id="btnFull" title="Pantalla completa">⛶ Pantalla completa</button>
    <button class="btn small" id="btnBlank" title="Abrir en pestaña about:blank">↗ Nueva pestaña</button>
    <button class="btn small danger" id="btnClose">✕ Cerrar</button>
  </div>
  <iframe id="playerFrame" title="Juego" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
<script>
let juegos = [], currentCat = "ALL", favoritos = [];
try { favoritos = JSON.parse(localStorage.getItem("ethos_favs")) || []; } catch {}

const lista = $("lista"), catBar = $("catBar"), searchBar = $("searchBar");

// Logo de reserva con las iniciales del juego
const ph = nombre => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="160"><rect width="100%" height="100%" fill="#112233"/>` +
  `<text x="50%" y="50%" fill="#00ff9d" font-family="monospace" font-size="42" text-anchor="middle" dominant-baseline="central">` +
  `${esc((nombre || "GAME").substring(0, 8).toUpperCase())}</text></svg>`);

async function cargarJuegos() {
  lista.innerHTML = '<div class="card skeleton"></div>'.repeat(6);
  try {
    const snap = await db.collection("games").get();
    juegos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
    render();
  } catch (e) {
    console.error(e);
    lista.innerHTML = '<p class="empty error">No se pudieron cargar los juegos. Revisa tu conexión y recarga la página.</p>';
  }
}

function render() { generarCategorias(); mostrarJuegos(); }

function generarCategorias() {
  const tags = [...new Set(juegos.map(j => j.category).filter(Boolean))];
  const btns = [["ALL", "TODOS"], ...tags.map(t => [t, t.toUpperCase()])];
  if (favoritos.length) btns.push(["FAVS", "★ FAVORITOS"]);
  catBar.innerHTML = btns.map(([k, label]) =>
    `<button class="cat-btn ${currentCat === k ? "active" : ""}" data-cat="${esc(k)}">${esc(label)}</button>`).join("");
}

function mostrarJuegos() {
  const f = searchBar.value.trim().toLowerCase();
  const filtrados = juegos.filter(j =>
    (!f || (j.nombre || "").toLowerCase().includes(f)) &&
    (currentCat === "ALL" || (currentCat === "FAVS" ? favoritos.includes(j.nombre) : j.category === currentCat)));

  lista.innerHTML = filtrados.length ? filtrados.map(j => `
    <article class="card" tabindex="0" data-id="${esc(j.id)}">
      <img src="${esc(safeUrl(j.logo) || ph(j.nombre))}" data-name="${esc(j.nombre)}" alt="${esc(j.nombre)}" loading="lazy">
      <button class="fav" data-fav="${esc(j.nombre)}" aria-label="Favorito">${favoritos.includes(j.nombre) ? "★" : "☆"}</button>
      <h3>${esc(j.nombre || "Sin nombre")}</h3>
      <small>${esc(j.category || "")}</small>
    </article>`).join("")
    : '<p class="empty">No hay juegos que coincidan con tu búsqueda.</p>';

  $("counter").textContent = `${filtrados.length} JUEGOS`;
}

// Si un logo falla, usa el de reserva
lista.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && !img.src.startsWith("data:")) img.src = ph(img.dataset.name);
}, true);

lista.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    const n = fav.dataset.fav;
    favoritos = favoritos.includes(n) ? favoritos.filter(f => f !== n) : [...favoritos, n];
    localStorage.setItem("ethos_favs", JSON.stringify(favoritos));
    if (currentCat === "FAVS" && !favoritos.length) currentCat = "ALL";
    return render();
  }
  const card = e.target.closest(".card[data-id]");
  if (card) abrirJuego(juegos.find(j => j.id === card.dataset.id));
});
lista.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("card")) e.target.click();
});

catBar.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (b) { currentCat = b.dataset.cat; render(); }
});
searchBar.addEventListener("input", mostrarJuegos);

// Reproductor dentro de la propia página
function abrirJuego(j) {
  const url = j && safeUrl(j.url);
  if (!url) return toast("La URL de este juego no es válida", true);
  $("playerTitle").textContent = j.nombre || "";
  $("playerFrame").src = url;
  $("player").classList.add("open");
  document.body.style.overflow = "hidden";
}
function cerrarJuego() {
  $("playerFrame").src = "about:blank";
  $("player").classList.remove("open");
  document.body.style.overflow = "";
}
function abrirBlank() {
  const url = $("playerFrame").src;
  const w = window.open("about:blank", "_blank");
  if (!w) return toast("Permite las ventanas emergentes para abrir el juego", true);
  w.document.title = $("playerTitle").textContent;
  w.document.body.style.cssText = "margin:0;background:#000;height:100vh";
  const f = w.document.createElement("iframe");
  f.style.cssText = "width:100%;height:100%;border:0";
  f.allowFullscreen = true;
  f.allow = "fullscreen; autoplay; gamepad";
  f.src = url;
  w.document.body.appendChild(f);
  cerrarJuego();
}
$("btnClose").onclick = cerrarJuego;
$("btnBlank").onclick = abrirBlank;
$("btnFull").onclick = () => $("playerFrame").requestFullscreen?.();

$("btnAI").onclick = () => window.open("https://script.google.com/macros/s/AKfycbw9TPeZki-pAXzV_S3_OHvpP9fC-5k9yU-UVNfJVSGVor3ls6IvcYvkDGKJg-FH_nwl/exec", "_blank", "noopener");
$("btnSpotify").onclick = () => window.open("https://open.spotify.com/embed/playlist/4L7KXkQeIQpxWNdXMfBVSM", "_blank", "noopener");

// Atajos: "/" busca, Esc cierra el juego
addEventListener("keydown", e => {
  if (e.key === "Escape" && $("player").classList.contains("open")) cerrarJuego();
  if (e.key === "/" && document.activeElement !== searchBar && !$("player").classList.contains("open")) {
    e.preventDefault(); searchBar.focus();
  }
});

cargarJuegos();
</script>
</body>
</html>
